<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Un traguardo da festeggiare</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f7efe3;font-family:Georgia,serif}.stage{min-height:100svh;display:grid;place-items:center;overflow:hidden;padding:0}.cover{position:relative;width:min(100vw,620px);height:100svh;background:url('busta.png') center/cover no-repeat;transition:opacity .65s ease,transform .8s ease}.seal{position:absolute;left:50%;top:50.2%;width:29%;aspect-ratio:1;transform:translate(-50%,-50%);border:0;background:transparent;border-radius:50%;cursor:pointer;touch-action:manipulation}.seal:after{content:"";position:absolute;inset:-8%;border-radius:50%;animation:pulse 1.8s infinite;box-shadow:0 0 0 0 rgba(132,18,23,.28)}@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(132,18,23,0)}100%{box-shadow:0 0 0 0 rgba(132,18,23,0)}}
.invite{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;background:#f7efe3;opacity:0;pointer-events:none;overflow:auto;padding:14px;transform:translateY(12%);transition:opacity .7s ease .35s,transform 1s cubic-bezier(.2,.75,.2,1) .2s}.invite img{display:block;width:min(100%,700px);height:auto;box-shadow:0 12px 35px #6d3a2a33}.opened .cover{opacity:0;transform:scale(.96)}.opened .invite{opacity:1;pointer-events:auto;transform:none}@media(min-width:700px){.cover{height:min(100svh,1000px);aspect-ratio:656/1199;width:auto}.seal{top:50.5%}}
</style></head><body><main class="stage" id="stage"><section class="cover" aria-label="Busta dell'invito"><button class="seal" id="seal" aria-label="Tocca il sigillo per aprire l'invito"></button></section><section class="invite"><img src="invito.png" alt="Invito: Un traguardo da festeggiare"></section></main><script>const s=document.getElementById('stage'),b=document.getElementById('seal');function openInvite(){s.classList.add('opened');setTimeout(()=>window.scrollTo(0,0),500)}b.addEventListener('click',openInvite);b.addEventListener('touchend',e=>{e.preventDefault();openInvite()},{passive:false});</script></body></html>
