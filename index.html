
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7efe3">
<title>Un traguardo da festeggiare</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #f7efe3;
  font-family: Georgia, serif;
}

body {
  overflow: hidden;
}

.stage {
  position: relative;
  width: 100%;
  height: 100svh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f7efe3;
}

/* BUSTA ORIGINALE */

.envelope {
  position: relative;
  width: min(100vw, 648px);
  height: auto;
  max-height: 100svh;
  aspect-ratio: 648 / 1199;
  flex-shrink: 0;
  opacity: 0;
  animation: appear 1s ease 4.2s forwards;
  transition: opacity .65s ease, transform .65s ease;
}

.envelope-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* AREA CLICCABILE SUL SIGILLO ORIGINALE */

.seal-button {
  position: absolute;
  left: 50%;
  top: 52.2%;
  width: 29%;
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  border: 0;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  z-index: 3;
}

.seal-button:focus-visible {
  outline: 3px solid #c99b48;
  outline-offset: 4px;
}

/* ESPLOSIONE INIZIALE */

.intro {
  position: absolute;
  inset: 0;
  z-index: 5;
  overflow: hidden;
  pointer-events: none;
  background: radial-gradient(ellipse at center, #fffdf6 0%, #f7efe3 45%, #e8d2b5 100%);
  animation: introOut .8s ease 4.2s forwards;
}

.intro-title {
  position: absolute;
  top: 43%;
  left: 5%;
  right: 5%;
  text-align: center;
  color: #7d1018;
  font-size: clamp(27px, 7vw, 45px);
  font-style: italic;
  font-weight: bold;
  text-shadow: 0 2px #fff8e9, 0 0 18px #e8c46b;
  opacity: 0;
  animation: titleIn .9s ease .25s forwards;
}

.intro-subtitle {
  position: absolute;
  top: 53%;
  left: 5%;
  right: 5%;
  text-align: center;
  color: #987137;
  font-size: clamp(11px, 3vw, 16px);
  letter-spacing: .18em;
  text-transform: uppercase;
  opacity: 0;
  animation: subtitleIn .7s ease .8s forwards;
}

.confetti {
  position: absolute;
  left: 50%;
  top: 48%;
  width: var(--w);
  height: var(--h);
  background: var(--color);
  border-radius: 2px;
  opacity: 0;
  animation: confettiFly var(--duration) ease-out var(--delay) forwards;
}

.firework {
  position: absolute;
  left: var(--x);
  top: var(--y);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--color);
  opacity: 0;
  box-shadow: 0 0 8px var(--color);
  animation: fireworks 1.8s ease-out var(--delay) forwards;
}

/* INVITO GRANDE */

.invite {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f7efe3;
  opacity: 0;
  visibility: hidden;
  transform: scale(.65);
  transition:
    opacity .75s ease,
    transform 1.05s cubic-bezier(.16,.8,.2,1),
    visibility 0s linear 1.05s;
}

.invite img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* APERTURA */

.stage.opening .envelope {
  opacity: 0;
  transform: scale(1.04);
  pointer-events: none;
}

.stage.opening .invite {
  opacity: 1;
  visibility: visible;
  transform: scale(1);
  transition-delay: 0s;
}

/* ANIMAZIONI */

@keyframes appear {
  from { opacity: 0; transform: translateY(18px) scale(.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes introOut {
  to { opacity: 0; visibility: hidden; }
}

@keyframes titleIn {
  0% { opacity: 0; transform: translateY(20px) scale(.65); }
  55% { opacity: 1; transform: translateY(-4px) scale(1.1); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes subtitleIn {
  to { opacity: 1; }
}

@keyframes confettiFly {
  0% {
    opacity: 0;
    transform: translate(0,0) rotate(0) scale(.3);
  }
  10% { opacity: 1; }
  65% { opacity: 1; }
  100% {
    opacity: 0;
    transform: translate(var(--dx),var(--dy))
      rotate(var(--rotation)) scale(1.4);
  }
}

@keyframes fireworks {
  0% {
    opacity: 0;
    box-shadow: 0 0 0 0 var(--color);
  }
  15% { opacity: 1; }
  100% {
    opacity: 0;
    box-shadow:
      0 -48px 0 -1px var(--color),
      34px -34px 0 -1px var(--color),
      48px 0 0 -1px var(--color),
      34px 34px 0 -1px var(--color),
      0 48px 0 -1px var(--color),
      -34px 34px 0 -1px var(--color),
      -48px 0 0 -1px var(--color),
      -34px -34px 0 -1px var(--color),
      0 -25px 0 0 #fff1bb,
      18px -18px 0 0 #fff1bb,
      25px 0 0 0 #fff1bb,
      18px 18px 0 0 #fff1bb,
      0 25px 0 0 #fff1bb,
      -18px 18px 0 0 #fff1bb,
      -25px 0 0 0 #fff1bb,
      -18px -18px 0 0 #fff1bb;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>
<main class="stage" id="stage">

  <div class="intro" id="intro">
    <div class="intro-title">È tempo di festeggiare!</div>
    <div class="intro-subtitle">Una gioia da condividere</div>
  </div>

  <section class="envelope" aria-label="Busta dell'invito">
    <img
      class="envelope-image"
      src="busta.png"
      alt="Busta bordeaux con sigillo della casetta"
    >

    <button
      class="seal-button"
      id="seal"
      aria-label="Tocca il sigillo per aprire l'invito"
    ></button>
  </section>

  <section class="invite" id="invite" aria-label="Invito completo">
    <img
      src="invito.png"
      alt="Invito con data, ora e indirizzo della festa"
    >
  </section>

</main>

<script>
(() => {
  const stage = document.getElementById('stage');
  const intro = document.getElementById('intro');
  const seal = document.getElementById('seal');

  const colors = [
    '#7d1018',
    '#a82b35',
    '#c99b48',
    '#e3c77f',
    '#b8cbd7',
    '#fff4d8',
    '#d7a0a2',
    '#f1d9a4'
  ];

  // 420 coriandoli per un'esplosione iniziale più ricca
  for (let i = 0; i < 420; i++) {
    const piece = document.createElement('i');
    piece.className = 'confetti';

    const angle = (Math.PI * 2 * i / 420)
      + (Math.random() - .5) * .6;

    const distance = 45 + Math.random() * 155;

    piece.style.setProperty('--w', (4 + Math.random() * 8) + 'px');
    piece.style.setProperty('--h', (7 + Math.random() * 17) + 'px');
    piece.style.setProperty('--color', colors[i % colors.length]);
    piece.style.setProperty('--dx', (Math.cos(angle) * distance) + 'vw');
    piece.style.setProperty('--dy', (Math.sin(angle) * distance) + 'vh');
    piece.style.setProperty('--rotation', (Math.random() * 1200 - 600) + 'deg');
    piece.style.setProperty('--duration', (2.8 + Math.random() * 2.2) + 's');
    piece.style.setProperty('--delay', (Math.random() * 1.15) + 's');

    intro.appendChild(piece);
  }

  // 12 fuochi d'artificio distribuiti su tutta la schermata
  const fireworks = [
    [12, 19, '#c99b48', .05], [82, 17, '#7d1018', .12],
    [25, 34, '#b8cbd7', .25], [72, 35, '#c99b48', .32],
    [48, 15, '#7d1018', .42], [91, 48, '#b8cbd7', .5],
    [8, 53, '#c99b48', .6], [31, 65, '#7d1018', .7],
    [68, 62, '#b8cbd7', .8], [51, 78, '#c99b48', .9],
    [17, 82, '#7d1018', 1.0], [86, 80, '#c99b48', 1.1]
  ];

  fireworks.forEach(([x, y, color, delay]) => {
    const firework = document.createElement('i');
    firework.className = 'firework';
    firework.style.setProperty('--x', x + '%');
    firework.style.setProperty('--y', y + '%');
    firework.style.setProperty('--color', color);
    firework.style.setProperty('--delay', delay + 's');
    intro.appendChild(firework);
  });

  let opened = false;

  seal.addEventListener('click', () => {
    if (opened) return;
    opened = true;

    stage.classList.add('opening');

    window.setTimeout(() => {
      document.getElementById('invite').scrollTop = 0;
    }, 1100);
  });
})();
</script>
</body>
</html>
