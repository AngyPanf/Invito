
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Un traguardo da festeggiare</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Georgia,serif;background:#f7efe3}
#stage{position:relative;width:100%;height:100dvh;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle,#fffdf7,#ead5bd)}
#party{position:absolute;inset:0;overflow:hidden;z-index:10;pointer-events:none;animation:fadeParty 1s ease 5.5s forwards}
#title{position:absolute;top:39%;width:100%;padding:0 15px;text-align:center;color:#7d1018;font-size:clamp(30px,8vw,48px);font-style:italic;font-weight:bold;opacity:0;animation:titleIn .8s .3s forwards}
#subtitle{position:absolute;top:51%;width:100%;text-align:center;color:#a27a34;letter-spacing:3px;font-size:12px;opacity:0;animation:titleIn .8s .8s forwards}
.confetti{position:absolute;left:50%;top:48%;width:var(--w);height:var(--h);background:var(--c);border-radius:2px;box-shadow:0 0 8px var(--c);animation:blast var(--t) cubic-bezier(.1,.7,.2,1) var(--delay) forwards;opacity:0}
.spark{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);background:#e4bd61;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 10px #e8c15c);animation:twinkle 1.5s var(--delay) forwards;opacity:0}
.ring{position:absolute;left:var(--x);top:var(--y);width:30px;height:30px;border:5px solid var(--c);border-radius:50%;transform:translate(-50%,-50%) scale(.1);animation:ring 1.8s var(--delay) ease-out forwards;opacity:0}
@keyframes blast{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.2)}8%{opacity:1}65%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1.5)}}
@keyframes twinkle{0%{opacity:0;transform:scale(.1) rotate(0)}20%{opacity:1;transform:scale(2.2) rotate(30deg)}65%{opacity:1;transform:scale(1.4) rotate(70deg)}100%{opacity:0;transform:scale(.1) rotate(120deg)}}
@keyframes ring{0%{opacity:0;transform:translate(-50%,-50%) scale(.1)}10%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(23)}}
@keyframes titleIn{to{opacity:1}}
@keyframes fadeParty{to{opacity:0;visibility:hidden}}
#envelope{position:relative;width:min(100vw,648px);height:min(100dvh,1199px);aspect-ratio:648/1199;background:url('busta.png') center/100% 100% no-repeat;opacity:0;animation:arrive .9s 5.8s forwards;overflow:hidden}
@keyframes arrive{to{opacity:1}}
#flap{position:absolute;inset:0;background:url('busta.png') center/100% 100% no-repeat;clip-path:polygon(4% 31.25%,95.5% 31.25%,49.5% 49.4%);transform-origin:50% 31.25%;transition:transform 1s ease;z-index:3;pointer-events:none}
#seal{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:28%;aspect-ratio:1;border-radius:50%;border:3px solid #c99b48;background:radial-gradient(circle at 30% 25%,#b52b32,#7d1018 60%,#4a060b);color:#f3d78b;font-size:clamp(35px,10vw,58px);box-shadow:inset 0 0 12px #ef9c6b;z-index:5;cursor:pointer}
#seal:after{content:"⌂"}
#card{position:absolute;z-index:2;width:72%;height:auto;left:14%;top:24%;opacity:0;transform:translateY(45%);transition:transform 2s ease,opacity 1s ease}
#hint{position:absolute;z-index:6;bottom:12%;width:100%;text-align:center;color:#f7e7c2;font-size:12px;letter-spacing:2px;text-shadow:0 1px 4px #42050a}
#full{position:absolute;inset:0;background:#f7efe3;display:grid;place-items:center;opacity:0;visibility:hidden;z-index:20;transition:opacity 1s}
#full img{width:100%;height:100%;object-fit:contain}
#envelope.open #flap{transform:rotateX(180deg)}
#envelope.open #seal{animation:breakSeal .55s forwards;pointer-events:none}
@keyframes breakSeal{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-50%) scale(1.15) rotate(12deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(.1) rotate(-40deg)}}
#envelope.open #card{opacity:1;transform:translateY(-8%)}
#envelope.open #hint{opacity:0}
#full.show{opacity:1;visibility:visible}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="stage">
  <div id="party">
    <div id="title">È tempo di festeggiare!</div>
    <div id="subtitle">UNA GIOIA DA CONDIVIDERE</div>
  </div>
  <section id="envelope">
    <div id="flap"></div>
    <button id="seal" aria-label="Rompi il sigillo"></button>
    <img id="card" src="invito.png" alt="Invito">
    <div id="hint">TOCCA IL SIGILLO PER APRIRE L'INVITO</div>
  </section>
  <section id="full"><img src="invito.png" alt="Invito completo"></section>
</main>
<script>
const party=document.getElementById('party');
const colors=['#7d1018','#a82b35','#c99b48','#e8c978','#b8cbd7','#fff4d8','#d7a0a2','#f1d9a4'];
for(let i=0;i<650;i++){
  const el=document.createElement('i');
  if(i%4===0){
    el.className='spark';
    el.style.setProperty('--x',Math.random()*100+'%');
    el.style.setProperty('--y',Math.random()*100+'%');
    el.style.setProperty('--s',(18+Math.random()*42)+'px');
    el.style.setProperty('--delay',(Math.random()*1.5)+'s');
  }else if(i%7===0){
    el.className='ring';
    el.style.setProperty('--x',Math.random()*100+'%');
    el.style.setProperty('--y',Math.random()*100+'%');
    el.style.setProperty('--c',colors[i%colors.length]);
    el.style.setProperty('--delay',(Math.random()*1.4)+'s');
  }else{
    el.className='confetti';
    const a=Math.random()*Math.PI*2;
    const d=30+Math.random()*100;
    el.style.setProperty('--w',(10+Math.random()*18)+'px');
    el.style.setProperty('--h',(18+Math.random()*27)+'px');
    el.style.setProperty('--c',colors[i%colors.length]);
    el.style.setProperty('--dx',(Math.cos(a)*d)+'vw');
    el.style.setProperty('--dy',(Math.sin(a)*d)+'vh');
    el.style.setProperty('--rot',(Math.random()*1800-900)+'deg');
    el.style.setProperty('--t',(2.8+Math.random()*2)+'s');
    el.style.setProperty('--delay',(Math.random()*1.3)+'s');
  }
  party.appendChild(el);
}
const envelope=document.getElementById('envelope');
document.getElementById('seal').addEventListener('click',()=>{
  envelope.classList.add('open');
  setTimeout(()=>document.getElementById('full').classList.add('show'),2400);
});
</script>
</body>
</html>
